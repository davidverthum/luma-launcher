// Luma Menu — the game's own title screen for the Luma pack. Build: gradlew build →
// build/libs/luma-menu-<version>.jar; the launcher ships it like any other mod (modpack.json).
plugins {
	id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = 'gg.luma'

base {
	archivesName = 'luma-menu'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The same source gives the same bytes, so a rebuild can be checked against modpack.json's sha512.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
