# Builds Luma on native runners: macOS universal .dmg, Windows .exe (NSIS), Linux .deb/.rpm/.AppImage.
# Run it from the Actions tab (Run workflow) or push a tag like v0.1.0. Files land in the run's artifacts.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges the shared latest.json by read-then-write against the release;
      # parallel matrix jobs race on that and can corrupt or delete it. Serialize instead.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows
            args: --bundles nsis
            targets: ''
          - os: ubuntu-22.04
            name: linux
            args: --bundles deb,rpm,appimage
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Manual run from the Actions tab: just build, no public release.
      - name: Build
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          CI: true

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: luma-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # Tag push (v*): build, sign and publish a GitHub Release with the updater's latest.json,
      # so every running Luma picks up the new version on its next update check.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Luma ${{ github.ref_name }}'
          args: ${{ matrix.args }}
