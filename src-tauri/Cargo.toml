[package]
name = "luma"
version = "0.1.4"
description = "Luma — лаунчер сети Minecraft-серверов"
authors = ["Luma"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "luma_lib"
# Desktop only. For iOS/Android add "staticlib", "cdylib" (a cdylib breaks the MinGW Windows link: too many exports).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: the screenshot album loads images from disk; image-png: copying one to the clipboard.
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
# The admin panel's RCON password, kept in the OS credential store.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# Mod downloads. rustls with the ring provider: no OpenSSL, no CMake, cross-compiles for Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
sha1 = "0.10"
base64 = "0.23"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
